# Reverse proxy of compose.yaml. A deployment with its own proxy needs the same
# locations there, with its own upstreams.

# If TLS ends in front of this proxy, pass the original scheme on. Over plain HTTP (a workshop on
# localhost) there is no such header.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # webdav's upload limit.
    client_max_body_size 100m;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    # ediarum.webdav: auth provider, admin app, WebDAV endpoint.
    location /api/auth/          { proxy_pass http://webdav:8080; }
    location /api/webdav/        { proxy_pass http://webdav:8080; proxy_buffering off; proxy_read_timeout 1h; }  # progress streams
    location /apps/webdav/       { proxy_pass http://webdav:8080; }
    location /webdav/connection/ { proxy_pass http://webdav:8080/connection/; proxy_request_buffering off; }

    # Other apps get their own /api/<id>/ and /apps/<id>/ locations here.

    location / { proxy_pass http://platform; }
}
