# Platform container. The public reverse proxy forwards every path it does not route elsewhere
# (/api/…, /apps/…, /webdav/connection/…) unchanged, so URLs here are the public ones.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Redirects must stay relative: absolute ones would point at this container, not the proxy.
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # Hashed build output: cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # App list, from public/config/apps.json. Missing → 404 → the platform shows an error page.
    location = /config/apps.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback for all router paths (/login, /zotero/…).
    location / {
        try_files $uri /index.html;
    }
}
